worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Raise connection ceiling for long-lived connections
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Microcache for /api/time - reduces origin load by ~98%
    proxy_cache_path /tmp/nginx_time_cache levels=1:2 keys_zone=time_cache:1m max_size=10m inactive=10s;

    # Upstream with keepalive connection pooling
    upstream simulive_backend {
        server simulive:3000;
        keepalive 256;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }


    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    server {
        listen 80;
        server_name _;

        # Use Docker's internal DNS resolver for upstream health checks
        resolver 127.0.0.11 valid=30s ipv6=off;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Health check endpoint for the nginx itself
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Time API - microcached for high-concurrency scaling
        # With 10k viewers polling every 3min (~55 req/s), this reduces origin to ~1 req/s
        location = /api/time {
            proxy_pass http://simulive_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Microcache for 1 second with stampede protection
            proxy_cache time_cache;
            proxy_cache_valid 200 1s;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;
            proxy_cache_key "$request_uri";

            add_header X-Cache-Status $upstream_cache_status;
        }

        # API routes - normal proxying with buffering
        location /api/ {
            proxy_pass http://simulive_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering for better performance
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 24k;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Next.js static assets - aggressive caching
        location /_next/static/ {
            proxy_pass http://simulive_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Cache static assets aggressively (they have hashed filenames)
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }

        # Public static files
        location /public/ {
            proxy_pass http://simulive_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache_valid 200 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # All other requests (pages, etc.)
        location / {
            proxy_pass http://simulive_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering for page loads
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
        }
    }
}
